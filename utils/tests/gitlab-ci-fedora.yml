# NS3 CI script for Fedora

# A single release job is run, to keep track of the ever-changing
# package names across distributions.

.base-fedora:
  extends: .base-build
  rules:
    - if: $RELEASE == "daily"
    - if: $RELEASE == "weekly"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      allow_failure: true
  image: fedora:latest
  before_script:
    - dnf update -y
    - dnf install -y
      gcc-c++ cmake ccache ninja-build
      boost-devel
      eigen3-devel
      gtk3 gtk3-devel
      gsl gsl-devel
      sqlite sqlite-devel
      libxml2 libxml2-devel
      mpich mpich-devel openssh
      goocanvas2-devel
      python python-devel
      python3-gobject-devel gobject-introspection-devel
      graphviz-devel graphviz ipython
      git
    - source /etc/profile.d/modules.sh
    - module load mpi/mpich-$(uname -m)
  variables:
    MODE: release
    COMPILER: g++

fedora:
  rules:
    - if: $RELEASE == "daily"
    - if: $RELEASE == "weekly"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
  stage: pre-build
  script:
    - echo "Starting Fedora jobs"

fedora-gcc-release:
  extends: .base-fedora
  needs: ["fedora"]
  stage: build

test-fedora-gcc-release:
  extends: .base-fedora
  stage: test
  needs: ["fedora-gcc-release"]
  dependencies:
    - fedora-gcc-release
