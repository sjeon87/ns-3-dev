name: Upstream status

on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0'
  push:
    paths:
      - upstream
      - upstream-state.json
      - upstream-map.json
      - .gitmodules
      - utils/upstream-status.py
      - utils/upstream_graph.py
      - utils/tests/test-upstream-status.py
      - .github/workflows/upstream-status.yml

permissions:
  contents: read

concurrency:
  group: upstream-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Test the tracker
        run: python3 utils/tests/test-upstream-status.py -v
      - name: Restore upstream observations and objects
        uses: actions/cache/restore@v4
        with:
          path: .cache/upstream
          key: upstream-status-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-status-${{ runner.os }}-
      - name: Audit upstreams
        run: |
          rm -f .cache/upstream/status.md .cache/upstream/status.json .cache/upstream/status.html
          python3 utils/upstream-status.py scan --timeout 600 --fail-on-attention
      - name: Save upstream observations and objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/upstream
          key: upstream-status-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Add report to job summary
        if: always()
        run: |
          if test -f .cache/upstream/status.md; then
            cat .cache/upstream/status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f .cache/upstream/status.html; then
            {
              echo ""
              echo "### Visual report"
              echo ""
              echo 'Download the **upstream-status** artifact from this run and open `status.html`.'
              echo ""
              echo "[Run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
              if [ "${{ vars.UPSTREAM_PAGES }}" = "true" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
                echo ""
                echo "[Published page](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-status
          path: |
            .cache/upstream/status.md
            .cache/upstream/status.json
            .cache/upstream/status.html
            .cache/upstream/observations.json
          if-no-files-found: warn

  publish:
    needs: audit
    if: >-
      always() && needs.audit.result != 'cancelled'
      && vars.UPSTREAM_PAGES == 'true'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: upstream-status
          path: reports
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp reports/status.html _site/index.html
          cp reports/status.md _site/status.md
          cp reports/status.json _site/status.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
