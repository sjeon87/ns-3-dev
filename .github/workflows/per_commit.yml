name: "CI"

on: [push]
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    outputs:
      cache_misses: ${{ env.cache_misses }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install apt-utils
          sudo apt-get -y install git gcc g++ cmake python3 make ninja-build
          sudo apt-get -y install tcpdump libgsl-dev libxml2-dev
          sudo apt-get -y install libboost-program-options-dev python3-dev pybind11-dev libprotobuf-dev protobuf-compiler libsctp-dev
          sudo apt-get -y install curl unzip tar
          sudo apt-get -y install ccache
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ubuntu-ci-${{env.time}}
          restore-keys: ubuntu-ci-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          ./ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          ./ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        if: env.cache_misses != '0'
        run: python3 test.py --no-build --verbose-failed

  Codecov:
    runs-on: ubuntu-latest
    needs: Ubuntu
    if: needs.Ubuntu.outputs.cache_misses != '0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install apt-utils
          sudo apt-get -y install git gcc g++ cmake python3 make ninja-build
          sudo apt-get -y install tcpdump libgsl-dev libxml2-dev
          sudo apt-get -y install curl unzip tar
          sudo apt-get -y install ccache
          sudo apt-get -y install lcov
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ubuntu-coverage-${{env.time}}
          restore-keys: ubuntu-coverage-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          ./ns3 configure --enable-asserts --enable-examples --enable-tests --disable-werror --enable-gcov -G"Ninja"
      - name: Build ns-3
        run: |
          ./ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Generate coverage data and submit to codecov.io
        if: env.cache_misses != '0'
        run: |
          ./ns3 build coverage_gcc
          cd ./build/coverage
          bash <(curl -s https://codecov.io/bash) -f ns3.info || echo "Codecov did not collect coverage reports"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Windows_MinGW:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable native symlinks
        shell: bash
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Resolve mmWave directory symlink
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src/mmwave -Force
          New-Item -ItemType SymbolicLink -Path src/mmwave -Target "$PWD/external/ns3-mmwave/src/mmwave"
          if (!(Test-Path src/mmwave/CMakeLists.txt)) { throw "mmWave module is missing" }
      - uses: msys2/setup-msys2@v2
      - name: Install required msys2/mingw64 packages
        run: |
          pacman -S --noconfirm \
          unzip \
          tar \
          mingw-w64-x86_64-curl \
          mingw-w64-x86_64-binutils \
          mingw-w64-x86_64-cmake \
          mingw-w64-x86_64-gcc \
          mingw-w64-x86_64-gdb \
          mingw-w64-x86_64-ninja \
          mingw-w64-x86_64-python \
          mingw-w64-x86_64-ccache \
          mingw-w64-x86_64-gsl \
          mingw-w64-x86_64-libxml2 \
          mingw-w64-x86_64-lld \
          mingw-w64-x86_64-boost \
          mingw-w64-x86_64-eigen3 \
          mingw-w64-x86_64-protobuf \
          mingw-w64-x86_64-pybind11 \
          sed
          pacman --noconfirm -Scc
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: msys2-${{env.time}}
          restore-keys: msys2-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          python3 ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja" -- -DPython_ROOT_DIR="$(cygpath -m /mingw64)" -DPython3_ROOT_DIR="$(cygpath -m /mingw64)" -DPython_FIND_REGISTRY=NEVER -DPython3_FIND_REGISTRY=NEVER
      - name: Build ns-3
        run: |
          cmake --build cmake-cache --target ns3-ai --config Release -j 2
          python3 ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        run: |
          export PATH="$PWD/build/lib:$PATH"
          cygcheck build/utils/ns3-dev-test-runner.exe || true
          gdb --batch -ex run -ex "thread apply all bt" --args build/utils/ns3-dev-test-runner.exe --suite=system-socket --verbose
          python3 ns3 run "test-runner --suite=system-socket --verbose" --no-build
          python3 test.py --no-build --verbose-failed
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: msys2-${{env.time}}

  Mac_OS_X:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-14 ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          brew uninstall cmake ninja
          brew install ninja cmake ccache libxml2 gsl open-mpi boost eigen protobuf pybind11 python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: osx_brew-${{ matrix.os }}-ci-${{env.time}}
          restore-keys: osx_brew-${{ matrix.os }}-ci-
      - name: Setup ccache
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ./ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          export PATH="$PATH" #:/usr/local/opt/qt/bin
          cmake --build cmake-cache --target ns3-ai --config Release -j 2
          ./ns3 build
      - name: Check mmWave attachment
        run: |
          ./ns3 run "test-runner --suite=mmwave-attachment-test --verbose" --no-build --command-template "lldb --batch -o run -k bt -- %s"
          ./ns3 run "test-runner --suite=mmwave-attachment-test --verbose" --no-build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        run: ./test.py --no-build --verbose-failed
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: osx_brew-${{ matrix.os }}-ci-${{env.time}}
  Windows_Visual_Studio:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    defaults:
      run:
        shell: cmd
    steps:
      - name: Enable native symlinks
        shell: bash
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Resolve mmWave directory symlink
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src/mmwave -Force
          New-Item -ItemType SymbolicLink -Path src/mmwave -Target "$PWD/external/ns3-mmwave/src/mmwave"
          if (!(Test-Path src/mmwave/CMakeLists.txt)) { throw "mmWave module is missing" }
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ github.sha }}
          restore-keys: vcpkg-x64-windows-
      - name: Install required packages
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          python -m pip install pybind11
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install boost-program-options boost-interprocess eigen3 protobuf gsl libxml2 sqlite3 --triplet x64-windows
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ github.sha }}
      - name: Configure CMake
        run: |
          for /f "delims=" %%i in ('python -m pybind11 --cmakedir') do set PYBIND11_DIR=%%i
          python ns3 configure --enable-tests --enable-examples --enable-asserts --disable-werror -d release -- -G"Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DPython_ROOT_DIR="%pythonLocation%" -DPython3_ROOT_DIR="%pythonLocation%" -Dpybind11_DIR="%PYBIND11_DIR%"
      - name: Build ns-3
        run: |
          cmake --build cmake-cache --target ns3-ai --config Release -j 2 || exit /b 1
          python ns3 build
      - name: Run tests and examples
        run: |
          set PATH=%CD%\build;%PATH%
          python .\test.py --no-build --verbose-failed
