name: "CI"

on: [push]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    outputs:
      cache_misses: ${{ env.cache_misses }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install apt-utils
          sudo apt-get -y install git gcc g++ cmake python3 make ninja-build
          sudo apt-get -y install tcpdump python3-dev
          sudo apt-get -y install curl zip unzip tar pkg-config autoconf automake libtool bison
          sudo apt-get -y install ccache
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build-support/vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          python3 utils/tests/test-vcpkg.py
          python3 utils/setup-vcpkg.py --no-submodules
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ubuntu-ci-${{env.time}}
          restore-keys: ubuntu-ci-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          ./ns3 configure --enable-vcpkg -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          ./ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        if: env.cache_misses != '0'
        run: python3 test.py --no-build --verbose-failed

  Codecov:
    runs-on: ubuntu-latest
    needs: Ubuntu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install apt-utils
          sudo apt-get -y install git gcc g++ cmake python3 make ninja-build
          sudo apt-get -y install tcpdump python3-dev
          sudo apt-get -y install curl zip unzip tar pkg-config autoconf automake libtool bison
          sudo apt-get -y install ccache
          sudo apt-get -y install lcov
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build-support/vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          python3 utils/tests/test-vcpkg.py
          python3 utils/setup-vcpkg.py --no-submodules
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ubuntu-coverage-${{env.time}}
          restore-keys: ubuntu-coverage-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          ./ns3 configure --enable-vcpkg --enable-asserts --enable-examples --enable-tests --disable-werror --enable-gcov -G"Ninja"
      - name: Build ns-3
        run: |
          ./ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Generate coverage data and submit to codecov.io
        run: |
          ./ns3 build coverage_gcc
          cd ./build/coverage
          bash <(curl -s https://codecov.io/bash) -f ns3.info || echo "Codecov did not collect coverage reports"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Windows_MinGW:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable native symlinks
        shell: bash
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Resolve mmWave directory symlink
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src/mmwave -Force
          New-Item -ItemType SymbolicLink -Path src/mmwave -Target "$PWD/external/ns3-mmwave/src/mmwave"
          if (!(Test-Path src/mmwave/CMakeLists.txt)) { throw "mmWave module is missing" }
      - uses: msys2/setup-msys2@v2
      - name: Install required msys2/mingw64 packages
        run: |
          for attempt in 1 2 3; do
            pacman -S --noconfirm \
            git \
            zip \
            unzip \
            tar \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-binutils \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gdb \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-python \
            mingw-w64-x86_64-ccache \
            mingw-w64-x86_64-lld \
            sed && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          pacman --noconfirm -Scc
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build-support/vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          python3 utils/tests/test-vcpkg.py
          python3 utils/setup-vcpkg.py --no-submodules
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: msys2-${{env.time}}
          restore-keys: msys2-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          python3 ns3 configure --enable-vcpkg -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja" -- -DPython_ROOT_DIR="$(cygpath -m /mingw64)" -DPython3_ROOT_DIR="$(cygpath -m /mingw64)" -DPython_FIND_REGISTRY=NEVER -DPython3_FIND_REGISTRY=NEVER
      - name: Build ns-3
        run: |
          cmake --build cmake-cache --target ns3-ai --config Release -j 2
          python3 ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        run: |
          export PATH="$PWD/build/lib:$PWD/cmake-cache/vcpkg_installed/x64-mingw-dynamic/bin:$PATH"
          python3 ns3 run "test-runner --suite=system-socket --verbose" --no-build || {
            cygcheck build/utils/ns3-dev-test-runner.exe || true
            gdb --batch -ex run -ex "thread apply all bt" --args build/utils/ns3-dev-test-runner.exe --suite=system-socket --verbose
            exit 1
          }
          python3 ns3 run "test-runner --suite=ntn-sagin --verbose --stop-on-failure" --no-build || {
            gdb --batch -ex "set breakpoint pending on" -ex "break std::__throw_out_of_range" -ex run -ex bt --args build/utils/ns3-dev-test-runner.exe --suite=ntn-sagin --verbose
            exit 1
          }
          python3 ns3 run sat-cbr-example --no-build || {
            gdb --batch -ex run -ex "thread apply all bt" --args build/contrib/satellite/examples/ns3-dev-sat-cbr-example.exe
            exit 1
          }
          python3 -u test.py --no-build --verbose-failed
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: msys2-${{env.time}}

  Mac_OS_X:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-14 ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install required packages
        run: |
          brew uninstall cmake ninja
          brew install ninja cmake ccache pkg-config autoconf automake libtool bison python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build-support/vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          python3 utils/tests/test-vcpkg.py
          python3 utils/setup-vcpkg.py --no-submodules
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: osx_brew-${{ matrix.os }}-ci-${{env.time}}
          restore-keys: osx_brew-${{ matrix.os }}-ci-
      - name: Setup ccache
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ./ns3 configure --enable-vcpkg -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          export PATH="$PATH" #:/usr/local/opt/qt/bin
          cmake --build cmake-cache --target ns3-ai --config Release -j 2
          ./ns3 build
      - name: Check mmWave attachment
        run: |
          ./ns3 run "test-runner --suite=mmwave-attachment-test --verbose" --no-build --command-template "lldb --batch -o run -k bt -- %s"
          ./ns3 run "test-runner --suite=mmwave-attachment-test --verbose" --no-build
      - name: Check satellite group cleanup
        if: matrix.os == 'macos-14'
        run: |
          satellite_test_dir="$PWD/testpy-output/satellite-cleanup-check"
          mkdir -p "$satellite_test_dir"
          ./ns3 run sat-group-example --no-build --cwd="$satellite_test_dir" --command-template "lldb --batch -o run -k bt -- %s"
          ./ns3 run sat-group-example --no-build --cwd="$satellite_test_dir"
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        run: ./test.py --no-build --verbose-failed
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: osx_brew-${{ matrix.os }}-ci-${{env.time}}
  Windows_Visual_Studio:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Enable native symlinks
        shell: bash
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Resolve mmWave directory symlink
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src/mmwave -Force
          New-Item -ItemType SymbolicLink -Path src/mmwave -Target "$PWD/external/ns3-mmwave/src/mmwave"
          if (!(Test-Path src/mmwave/CMakeLists.txt)) { throw "mmWave module is missing" }
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ github.sha }}
          restore-keys: vcpkg-x64-windows-
      - name: Install required packages
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          python utils/tests/test-vcpkg.py
          python utils/setup-vcpkg.py --no-submodules
      - name: Configure CMake
        run: |
          python ns3 configure --enable-vcpkg --enable-tests --enable-examples --enable-asserts --disable-werror -d release -- -G"Visual Studio 18 2026" -A x64 -T ClangCL -DPython_ROOT_DIR="%pythonLocation%" -DPython3_ROOT_DIR="%pythonLocation%"
      - name: Build ns-3
        run: |
          cmake --build cmake-cache --target ns3-ai --config Release -j 2 || exit /b 1
          cmake --build cmake-cache --target traffic --config Release -j 2 || exit /b 1
          python ns3 build
      - name: Run tests and examples
        run: |
          set PATH=%CD%\build;%CD%\cmake-cache\vcpkg_installed\x64-windows\bin;%PATH%
          python ns3 run "test-runner --suite=system-socket --verbose" --no-build || exit /b 1
          set NS3_SAT_TEST_FAILED=0
          python ns3 run "test-runner --suite=sat-constellation-test --verbose" --no-build || set NS3_SAT_TEST_FAILED=1
          python ns3 run "test-runner --suite=sat-mobility-observer-test --verbose" --no-build || set NS3_SAT_TEST_FAILED=1
          if "%NS3_SAT_TEST_FAILED%"=="1" exit /b 1
          python .\test.py --no-build --verbose-failed
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-x64-windows-${{ github.sha }}
